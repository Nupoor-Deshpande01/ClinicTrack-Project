<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 460" role="img" aria-label="Doctor with clipboard illustration">
  <!-- background blob -->
  <circle cx="210" cy="230" r="200" fill="#DBEAFE"/>
  <circle cx="330" cy="120" r="60" fill="#EAF2FF"/>
  <!-- cross symbol -->
  <g transform="translate(52 60)" fill="#2563EB">
    <rect x="18" y="0" width="12" height="36" rx="4"/>
    <rect x="0" y="12" width="48" height="12" rx="4"/>
  </g>
  <!-- doctor: white coat -->
  <g>
    <path d="M160 460 tr0" fill="none"/>
    <path d="M210 150
             C 160 150 140 190 140 230
             L 140 460 L 280 460 L 280 230
             C 280 190 260 150 210 150 Z" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
    <!-- coat opening -->
    <path d="M210 170 L 188 460 L 232 460 Z" fill="#EAF2FF"/>
    <!-- stethoscope -->
    <path d="M175 200 C 170 260 195 285 210 285 C 225 285 250 260 245 200" stroke="#2563EB" stroke-width="7" fill="none" stroke-linecap="round"/>
    <circle cx="210" cy="292" r="14" fill="#2563EB"/>
    <circle cx="210" cy="292" r="6" fill="#DBEAFE"/>
    <!-- neck + head -->
    <rect x="196" y="118" width="28" height="36" fill="#FCD9C0"/>
    <circle cx="210" cy="96" r="38" fill="#FCD9C0"/>
    <!-- hair -->
    <path d="M172 96 C 170 60 250 58 248 96 C 250 70 228 54 210 54 C 192 54 170 70 172 96 Z" fill="#334155"/>
    <!-- eyes + smile -->
    <circle cx="196" cy="98" r="4" fill="#0F172A"/>
    <circle cx="224" cy="98" r="4" fill="#0F172A"/>
    <path d="M198 116 Q 210 126 222 116" stroke="#0F172A" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- clipboard -->
    <g transform="translate(288 240) rotate(6)">
      <rect x="0" y="0" width="86" height="118" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="3"/>
      <rect x="28" y="-8" width="30" height="14" rx="6" fill="#93C5FD"/>
      <rect x="12" y="22" width="62" height="7" rx="3.5" fill="#DBEAFE"/>
      <rect x="12" y="38" width="50" height="7" rx="3.5" fill="#DBEAFE"/>
      <rect x="12" y="54" width="58" height="7" rx="3.5" fill="#DBEAFE"/>
      <rect x="12" y="78" width="34" height="10" rx="5" fill="#2563EB"/>
    </g>
  </g>
</svg>
